[project]
name = "kicad-animator"
version = "0.2.0"
description = "Gerador universal de animações e vídeos 3D para placas KiCad (Blender GPU & KiCad Nativo)"
authors = [
    {name = "Julian Vitor"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy (>=1.24.0)",
    "pywebview (>=5.0.0)"
]

[project.optional-dependencies]
blender = [
    "bpy>=5.3.0; python_version >= '3.13' and python_version < '3.14'",
    "bpy>=4.0.0; python_version >= '3.11' and python_version < '3.12'"
]

[project.scripts]
kicad-animator = "main:main"

[tool.poetry]
packages = [
    { include = "core" },
    { include = "engines" },
    { include = "ui" },
    { include = "main.py" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
