name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview numpy bpy

      - name: Build Standalone Windows Executable
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "KiCad-Animator" `
            --add-data "ui;ui" `
            --collect-all bpy `
            --collect-all numpy `
            --collect-all pywebview `
            --collect-all pythonnet `
            --collect-all clr_loader `
            --hidden-import "clr" `
            --hidden-import "webview.platforms.winforms" `
            --hidden-import "logging.handlers" `
            --hidden-import "tomllib" `
            --hidden-import "xml.dom.minidom" `
            --hidden-import "xml.etree.ElementTree" `
            --hidden-import "colorsys" `
            main.py
          @'
          <?xml version="1.0" encoding="utf-8" ?>
          <configuration>
            <runtime>
              <loadFromRemoteSources enabled="true"/>
            </runtime>
          </configuration>
          '@ | Set-Content -Path "dist\KiCad-Animator\KiCad-Animator.exe.config" -Encoding UTF8
          Compress-Archive -Path dist\KiCad-Animator -DestinationPath dist\KiCad-Animator-Windows-x64.zip

      - name: Upload Windows Asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: dist/KiCad-Animator-Windows-x64.zip

  build-macos:
    name: Build macOS (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview numpy bpy pyobjc-framework-WebKit pyobjc-framework-Cocoa

      - name: Build Standalone macOS App
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "KiCad-Animator" \
            --add-data "ui:ui" \
            --collect-all bpy \
            --collect-all numpy \
            --hidden-import "logging.handlers" \
            --hidden-import "tomllib" \
            --hidden-import "xml.dom.minidom" \
            --hidden-import "xml.etree.ElementTree" \
            --hidden-import "colorsys" \
            main.py
          cd dist
          zip -r KiCad-Animator-macOS.zip KiCad-Animator.app

      - name: Upload macOS Asset
        uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: dist/KiCad-Animator-macOS.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release files
        run: |
          mkdir -p final-assets
          find release-artifacts -name "*.zip" -exec cp {} final-assets/ \;
          ls -la final-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
